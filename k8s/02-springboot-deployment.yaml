---
# ConfigMap for Spring Boot application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-config
  namespace: tcc-microsservices
  labels:
    app: springboot-api
    component: config
    framework: spring-boot
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usp-tcc-microsservices
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: "20"
  SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES: "true"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_PROFILES_ACTIVE: prod
  SERVER_SERVLET_CONTEXT_PATH: /api
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics

---
# Secret for Spring Boot sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: springboot-secret
  namespace: tcc-microsservices
  labels:
    app: springboot-api
    component: secret
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: postgres
  JWT_SECRET: tcc-microsservices-jwt-secret-2026

---
# Deployment for Spring Boot API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-api
  namespace: tcc-microsservices
  labels:
    app: springboot-api
    component: api
    framework: spring-boot
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: springboot-api
  template:
    metadata:
      labels:
        app: springboot-api
        component: api
        framework: spring-boot
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: tcc-deployment-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: springboot-api
        image: openjdk:17-slim-bullseye
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          if [ -z "$SKIP_BUILD" ]; then
            apt-get update && apt-get install -y maven && \
            mvn clean package -DskipTests -B -q
          fi
          java -XX:+UseContainerSupport \
               -XX:MaxRAMPercentage=75.0 \
               -XX:InitialRAMPercentage=50.0 \
               -XX:+UseG1GC \
               -XX:MaxGCPauseMillis=200 \
               -Dspring.profiles.active=prod \
               -jar target/*.jar
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: springboot-config
        - secretRef:
            name: springboot-secret
        env:
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m"
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "20"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - springboot-api
              topologyKey: kubernetes.io/hostname
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - postgres
              topologyKey: kubernetes.io/hostname
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Service for Spring Boot API
apiVersion: v1
kind: Service
metadata:
  name: springboot-api
  namespace: tcc-microsservices
  labels:
    app: springboot-api
    component: api
    framework: spring-boot
spec:
  type: ClusterIP
  selector:
    app: springboot-api
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    name: http

---
# HorizontalPodAutoscaler for Spring Boot
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: springboot-api-hpa
  namespace: tcc-microsservices
  labels:
    app: springboot-api
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: springboot-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 1
        periodSeconds: 15
      selectPolicy: Max

---
# PodDisruptionBudget for Spring Boot
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: springboot-api-pdb
  namespace: tcc-microsservices
  labels:
    app: springboot-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: springboot-api
