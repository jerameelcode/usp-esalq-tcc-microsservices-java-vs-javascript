---
# ConfigMap for NestJS application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nestjs-config
  namespace: tcc-microsservices
  labels:
    app: nestjs-api
    component: config
    framework: nestjs
data:
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_USER: postgres
  PG_DATABASE: usp-tcc-microsservices
  PORT: "3000"
  NODE_ENV: production
  LOG_LEVEL: info

---
# Secret for NestJS sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: nestjs-secret
  namespace: tcc-microsservices
  labels:
    app: nestjs-api
    component: secret
type: Opaque
stringData:
  PG_PASSWORD: postgres
  JWT_SECRET: tcc-microsservices-jwt-secret-2026
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/usp-tcc-microsservices

---
# Deployment for NestJS API
# Note: Optimized resource requests based on benchmark results showing 56% lower CPU and 57.8% lower memory
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-api
  namespace: tcc-microsservices
  labels:
    app: nestjs-api
    component: api
    framework: nestjs
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nestjs-api
  template:
    metadata:
      labels:
        app: nestjs-api
        component: api
        framework: nestjs
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tcc-deployment-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nestjs-api
        image: node:20-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          npm install --legacy-peer-deps --prefer-offline --no-audit && \
          npm run build && \
          npm run start:prod
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: nestjs-config
        - secretRef:
            name: nestjs-secret
        env:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=512"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - nestjs-api
              topologyKey: kubernetes.io/hostname
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - postgres
              topologyKey: kubernetes.io/hostname
      restartPolicy: Always
      terminationGracePeriodSeconds: 25

---
# Service for NestJS API
apiVersion: v1
kind: Service
metadata:
  name: nestjs-api
  namespace: tcc-microsservices
  labels:
    app: nestjs-api
    component: api
    framework: nestjs
spec:
  type: ClusterIP
  selector:
    app: nestjs-api
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    name: http

---
# HorizontalPodAutoscaler for NestJS
# Note: More aggressive scaling due to lower resource footprint
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nestjs-api-hpa
  namespace: tcc-microsservices
  labels:
    app: nestjs-api
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nestjs-api
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 10
      - type: Pods
        value: 2
        periodSeconds: 10
      selectPolicy: Max

---
# PodDisruptionBudget for NestJS
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nestjs-api-pdb
  namespace: tcc-microsservices
  labels:
    app: nestjs-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nestjs-api
