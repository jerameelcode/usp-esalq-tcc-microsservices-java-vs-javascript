---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nestjs-config
data:
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_USER: postgres
  PG_PASSWORD: postgres
  PG_DATABASE: usp-tcc-microsservices
  JWT_SECRET: tcc-microsservices-jwt-secret-2026
  PORT: "3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nestjs-api
  template:
    metadata:
      labels:
        app: nestjs-api
    spec:
      containers:
      - name: nestjs-api
        image: node:20-alpine
        imagePullPolicy: Never
        workingDir: /app
        command:
        - sh
        - -c
        - |
          npm install --legacy-peer-deps &&
          npm run build &&
          npm run start:prod
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: nestjs-config
        volumeMounts:
        - name: source
          mountPath: /app
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: source
        hostPath:
          path: /Users/jerameelgonga/Desktop/projects/study/usp/tcc/usp-esalq-tcc-microsservices-java-vs-javascript/javascript
          type: Directory
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: nestjs-api
spec:
  selector:
    app: nestjs-api
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    nodePort: 30003
  type: NodePort
