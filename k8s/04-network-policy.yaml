---
# NetworkPolicy: Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tcc-microsservices
  labels:
    component: network-policy
    policy: default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# NetworkPolicy: Allow postgres internal communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-from-apps
  namespace: tcc-microsservices
  labels:
    app: postgres
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: springboot-api
    - podSelector:
        matchLabels:
          app: nestjs-api
    ports:
    - protocol: TCP
      port: 5432

---
# NetworkPolicy: Allow spring boot internal communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: springboot-allow-ingress
  namespace: tcc-microsservices
  labels:
    app: springboot-api
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: springboot-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ingress-nginx
      namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080

---
# NetworkPolicy: Allow nestjs internal communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nestjs-allow-ingress
  namespace: tcc-microsservices
  labels:
    app: nestjs-api
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: nestjs-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ingress-nginx
      namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3000

---
# NetworkPolicy: Allow DNS egress for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: tcc-microsservices
  labels:
    component: network-policy
    policy: allow-dns
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

---
# NetworkPolicy: Allow all egress from apps to postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: tcc-microsservices
  labels:
    component: network-policy
    policy: allow-egress
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

---
# NetworkPolicy: Allow cross-namespace monitoring (if Prometheus is in different namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: tcc-microsservices
  labels:
    component: network-policy
    policy: allow-monitoring
spec:
  podSelector:
    matchExpressions:
    - key: prometheus-scrape
      operator: In
      values:
      - "true"
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 3000
