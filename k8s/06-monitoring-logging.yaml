---
# ServiceMonitor for Prometheus (if using Prometheus Operator)
apiVersion: v1
kind: Service
metadata:
  name: prometheus-metrics
  namespace: tcc-microsservices
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: prometheus

---
# ConfigMap for Prometheus scrape configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tcc-microsservices
  labels:
    app: prometheus
    component: config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: tcc-microsservices
        environment: production
    
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    
    rule_files:
    - '/etc/prometheus/rules/*.yml'
    
    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
    
    - job_name: 'springboot-api'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tcc-microsservices
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: springboot-api
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      metrics_path: /actuator/prometheus
    
    - job_name: 'nestjs-api'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tcc-microsservices
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: nestjs-api
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      metrics_path: /metrics
    
    - job_name: 'postgres'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tcc-microsservices
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: postgres
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

---
# ConfigMap for alerting rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: tcc-microsservices
  labels:
    app: prometheus
    component: rules
data:
  alert-rules.yml: |
    groups:
    - name: tcc-microservices
      interval: 30s
      rules:
      # API availability alerts
      - alert: APIHighErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High error rate detected on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
      
      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High latency detected on {{ $labels.job }}"
          description: "p95 latency is {{ $value | humanizeDuration }}"
      
      # Resource utilization alerts
      - alert: PodCPUHigh
        expr: (sum(rate(container_cpu_usage_seconds_total[5m])) by (pod_name) / sum(container_spec_cpu_quota/container_spec_cpu_period) by (pod_name)) > 0.9
        for: 5m
        labels:
          severity: warning
          component: resource
        annotations:
          summary: "High CPU usage on pod {{ $labels.pod_name }}"
          description: "CPU usage is {{ $value | humanizePercentage }}"
      
      - alert: PodMemoryHigh
        expr: (sum(container_memory_usage_bytes) by (pod_name) / sum(container_spec_memory_limit_bytes) by (pod_name)) > 0.9
        for: 5m
        labels:
          severity: warning
          component: resource
        annotations:
          summary: "High memory usage on pod {{ $labels.pod_name }}"
          description: "Memory usage is {{ $value | humanizePercentage }}"
      
      # Database alerts
      - alert: PostgresConnectionHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High number of connections to PostgreSQL"
          description: "Active connections: {{ $value }} (threshold: 80)"
      
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been unreachable for 1 minute"
      
      # Pod restart alerts
      - alert: PodRestartingFrequently
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: pod
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting frequently"
          description: "Restart rate: {{ $value }}/min"

---
# Service for logging aggregation (Loki - optional)
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: tcc-microsservices
  labels:
    app: loki
    component: logging
data:
  loki-config.yaml: |
    auth_enabled: false
    ingester:
      chunk_idle_period: 3m
      chunk_retain_period: 1m
      max_chunk_age: 1h
      chunk_encoding: snappy
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    schema_config:
      configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema:
          prefix: index_
          version: v11
        index:
          prefix: index_
          period: 24h
    server:
      http_listen_port: 3100
      log_level: info
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        cache_location: /loki/boltdb-shipper-cache
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks
    chunk_store_config:
      max_look_back_period: 0s
    table_manager:
      retention_deletes_enabled: false

---
# ConfigMap for Fluent Bit log forwarding
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: tcc-microsservices
  labels:
    app: fluent-bit
    component: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf
    
    [INPUT]
        Name              tail
        Path              /var/log/containers/tcc-microsservices_*.log
        Parser            docker
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
    
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
    
    [OUTPUT]
        Name   stdout
        Match  *
    
    [OUTPUT]
        Name   loki
        Match  *
        Host   loki
        Port   3100
        Labels job=fluentbit

---
# RoleBinding for monitoring service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tcc-monitoring-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: tcc-deployment-sa
  namespace: tcc-microsservices
